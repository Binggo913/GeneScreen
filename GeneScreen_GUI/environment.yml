# GeneScreen 1.0 开发环境 (Linux/WSL)
# 安装: micromamba create -f environment.yml
# 激活: micromamba activate genescreen

name: genescreen
channels:
  - conda-forge
dependencies:
  - python=3.10
  - ripgrep>=14        # GFF 文件搜索
  - patchelf           # Nuitka 打包依赖
  - pip:
    - PySide6>=6.5     # GUI 框架
    - pyfaidx          # FASTA 索引/提取
    - biopython        # BLAST 结果解析
    - nuitka           # 打包工具
    - ordered-set      # Nuitka 依赖
    - zstandard        # Nuitka 压缩
