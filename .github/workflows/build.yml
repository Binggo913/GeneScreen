name: Build GUI Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME: GeneScreen
  APP_VERSION: "1.0"
  PYTHON_VERSION: "3.11"

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
    steps:
      - name: Build metadata
        id: meta
        run: |
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-2025
            python-arch: x64
          - platform: windows
            arch: arm64
            runner: windows-11-arm
            python-arch: arm64
          - platform: macos
            arch: x64
            runner: macos-15-intel
            python-arch: x64
          - platform: macos
            arch: arm64
            runner: macos-15
            python-arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python-arch }}

      - name: Install Python dependencies
        working-directory: GeneScreen_GUI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install macOS packaging dependency
        if: matrix.platform == 'macos'
        run: brew install create-dmg

      - name: Build with Nuitka
        working-directory: GeneScreen_GUI
        run: python build.py

      - name: Package Windows build
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: GeneScreen_GUI
        run: |
          $PackageName = "${{ env.APP_NAME }}_${{ needs.metadata.outputs.version }}_${{ matrix.platform }}_${{ matrix.arch }}_${{ needs.metadata.outputs.timestamp }}"
          $PackageDir = Join-Path "dist/packages" $PackageName
          $SourceDir = Get-ChildItem -Path "dist" -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $SourceDir) {
            throw "Nuitka .dist directory not found"
          }
          New-Item -ItemType Directory -Force -Path $PackageDir | Out-Null
          Copy-Item -Path (Join-Path $SourceDir.FullName "*") -Destination $PackageDir -Recurse -Force
          Compress-Archive -Path $PackageDir -DestinationPath "dist/packages/$PackageName.zip" -Force

      - name: Package macOS build
        if: matrix.platform == 'macos'
        shell: bash
        working-directory: GeneScreen_GUI
        run: |
          package_name="${APP_NAME}_${{ needs.metadata.outputs.version }}_${{ matrix.platform }}_${{ matrix.arch }}_${{ needs.metadata.outputs.timestamp }}"
          app_path="$(find dist -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "Nuitka .app bundle not found" >&2
            exit 1
          fi
          mkdir -p dist/packages
          stage_dir="dist/packages/${package_name}-stage"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"
          cp -R "$app_path" "$stage_dir/${APP_NAME}.app"
          create-dmg \
            --volname "${APP_NAME}" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 200 \
            --icon "${APP_NAME}.app" 150 200 \
            "dist/packages/${package_name}.dmg" \
            "$stage_dir"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.metadata.outputs.timestamp }}
          path: GeneScreen_GUI/dist/packages/${{ env.APP_NAME }}_${{ needs.metadata.outputs.version }}_${{ matrix.platform }}_${{ matrix.arch }}_${{ needs.metadata.outputs.timestamp }}.*

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
