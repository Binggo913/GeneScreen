# Windows 环境
# BLAST+ 需要手动下载安装: https://ftp.ncbi.nlm.nih.gov/blast/executables/blast+/LATEST/ncbi-blast-2.17.0+-win64.exe

name: genescreen
channels:
  - conda-forge
dependencies:
  - python=3.10
  - ripgrep>=14
  - cairo              # cairosvg 运行时依赖
  - cairosvg           # LINKVIEW 依赖，SVG 转 PNG
  - pip:
    - pyfaidx
    - biopython
